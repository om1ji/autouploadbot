AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: YouTube audio uploader - событийная схема на Lambda

Parameters:
  ChannelMap:
    Type: String
    # «UC…:чат|чат,UC…:чат» без кавычек (их SAM искажает); собирается из
    # channels.yaml командой tools/deploy.py
    AllowedPattern: '^UC[\w-]{22}:[-@\w|]+(,UC[\w-]{22}:[-@\w|]+)*$'
    ConstraintDescription: карта каналов — деплойте через tools/deploy.py, он собирает её из channels.yaml
    Description: Какие каналы YouTube смотреть и в какие чаты Telegram отправлять треки каждого
  AdminChatId:
    Type: String
    AllowedPattern: '^-?[0-9]+$'
    ConstraintDescription: числовой ID чата Telegram
    Description: Служебный чат — сюда приходят алярмы; обычно ваш личный ID в Telegram
  BotTokenParam:
    Type: String
    Default: /autouploadbot/bot-token
  HubSecretParam:
    Type: String
    Default: /autouploadbot/hub-secret
  LeaseSeconds:
    Type: String
    Default: '432000'
  WorkerConcurrency:
    Type: Number
    Default: 5
    MinValue: 2
    Description: Сколько треков качается параллельно (минимум 2)

Globals:
  Function:
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:

  # ---------- очередь ----------

  VideoQueue:
    Type: AWS::SQS::Queue
    Properties:
      # должен быть не меньше таймаута воркера, иначе SQS отдаст сообщение
      # второму обработчику, пока первый ещё качает
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VideoDLQ.Arn
        maxReceiveCount: 3

  VideoDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  # ---------- дедупликация ----------

  DedupTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: video_id
          AttributeType: S
      KeySchema:
        - AttributeName: video_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Что опрос фидов уже видел. Отдельно от DedupTable: та отмечает
  # обработанное воркером, а эта — замеченное в фиде, и смешивать их нельзя.
  # Без TTL: ролик может сидеть в фиде месяцами, пока не выйдут 15 новых
  SeenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: item_id
          AttributeType: S
      KeySchema:
        - AttributeName: item_id
          KeyType: HASH

  # ---------- cookies YouTube ----------

  CookiesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---------- вебхук ----------

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ingest/
      Handler: app.handler
      Runtime: python3.12
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          QUEUE_URL: !Ref VideoQueue
          HUB_SECRET_PARAM: !Ref HubSecretParam
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VideoQueue.QueueName
        - !Ref SsmReadPolicy

  # ---------- воркер ----------

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 900
      MemorySize: 2048
      # у Lambda /tmp — настоящий эфемерный диск, он не отъедает MemorySize
      EphemeralStorage:
        Size: 4096
      Environment:
        Variables:
          CHANNEL_MAP: !Ref ChannelMap
          BOT_TOKEN_PARAM: !Ref BotTokenParam
          DEDUP_TABLE: !Ref DedupTable
          COOKIES_BUCKET: !Ref CookiesBucket
      Events:
        Videos:
          Type: SQS
          Properties:
            Queue: !GetAtt VideoQueue.Arn
            BatchSize: 1
            # Лимит держим на источнике событий, а не через
            # ReservedConcurrentExecutions: то упирается в квоту аккаунта
            # и заодно отняло бы параллелизм у вебхука
            ScalingConfig:
              MaximumConcurrency: !Ref WorkerConcurrency
        # проба cookies: метаданные свежего ролика без скачивания
        CookieProbe:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)
            Input: '{"probe": true}'
            # проба сама не падает, а повтор упавшей был бы лишним шумом
            RetryPolicy:
              MaximumRetryAttempts: 0
      Policies:
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref DedupTable
        - S3ReadPolicy:
            BucketName: !Ref CookiesBucket
        - !Ref SsmReadPolicy
    Metadata:
      Dockerfile: worker/Dockerfile
      DockerContext: .
      DockerTag: latest

  # ---------- опрос фидов ----------

  # страховка к push: хаб Google с 19.09.2026 не подтверждает подписки
  PollFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ingest/
      Handler: poll.handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          CHANNEL_MAP: !Ref ChannelMap
          QUEUE_URL: !Ref VideoQueue
          SEEN_TABLE: !Ref SeenTable
      Events:
        Poll:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VideoQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref SeenTable

  # ---------- продление подписки ----------

  ResubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/resubscribe/
      Handler: app.handler
      Runtime: python3.12
      # 15 с из Globals не хватало: нужен запас на холодный старт boto3,
      # чтение секрета и сам запрос к хабу
      Timeout: 60
      Environment:
        Variables:
          # URL известен прямо в шаблоне — двухфазный деплой не нужен
          CALLBACK_URL: !GetAtt WebhookFunctionUrl.FunctionUrl
          CHANNEL_MAP: !Ref ChannelMap
          LEASE_SECONDS: !Ref LeaseSeconds
          HUB_SECRET_PARAM: !Ref HubSecretParam
      Events:
        # дожимает неподтверждённую подписку, пока хаб Google отдаёт 503
        Retry:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)
            Input: '{"force": false}'
        # продление аренды: она живёт 5 суток, так что раз в сутки с запасом
        Renew:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 day)
            Input: '{"force": true}'
      Policies:
        - !Ref SsmReadPolicy

  # ---------- алярмы ----------

  AlertTopic:
    Type: AWS::SNS::Topic

  # пересылает срабатывания и возвраты в норму в служебный чат
  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/alerts/
      Handler: app.handler
      Runtime: python3.12
      Environment:
        Variables:
          ADMIN_CHAT_ID: !Ref AdminChatId
          BOT_TOKEN_PARAM: !Ref BotTokenParam
      Events:
        Alarm:
          Type: SNS
          Properties:
            Topic: !Ref AlertTopic
      Policies:
        - !Ref SsmReadPolicy

  # Первая строка описания — заголовок сообщения, остальное — что делать
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: |-
        В DLQ есть треки, которые не удалось отправить
        Воркер трижды не справился с роликом. Причина — в логах WorkerFunction: чаще всего протухли cookies или файл больше 50 МБ. После исправления верните треки из DLQ — команда в README, раздел про cookies.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt VideoDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  QueueStuckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: |-
        Очередь не разбирается больше часа
        Сообщение ждёт в VideoQueue дольше часа: воркер не запускается или падает до обработки. Смотрите логи WorkerFunction.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt VideoQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  CookieProbeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: |-
        Проба cookies не прошла
        YouTube не отдаёт ролик с IP AWS — скорее всего, протухли cookies. Выгрузите новые из окна инкогнито и наберите tools/upload_cookies.sh. Пока cookies не обновлены, новые треки будут копиться в DLQ.
      Namespace: autouploadbot
      MetricName: CookieProbe
      Statistic: Minimum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ---------- общая политика чтения секретов ----------

  SsmReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BotTokenParam}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${HubSecretParam}
          - Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

Outputs:
  WebhookUrl:
    Description: Callback URL для PubSubHubbub
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  QueueUrl:
    Value: !Ref VideoQueue
  DeadLetterQueueUrl:
    Description: Сюда падают сообщения после трёх неудачных попыток
    Value: !Ref VideoDLQ
  ResubscribeFunctionName:
    Value: !Ref ResubscribeFunction
  CookiesBucketName:
    Description: Сюда кладётся cookies.txt для yt-dlp
    Value: !Ref CookiesBucket
